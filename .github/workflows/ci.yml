name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jcr
          POSTGRES_USER: jcr
          POSTGRES_PASSWORD: jcr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jcr -d jcr"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://jcr:jcr@127.0.0.1:5432/jcr
      JCR_DATABASE_URL: postgres://jcr:jcr@127.0.0.1:5432/jcr
      JCR_JWT_SECRET: ci-only-secret-with-at-least-32-bytes
      JCR_BOOTSTRAP_EMAIL: jose@example.com
      JCR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      JCR_TEST_S3_REGION: us-east-1
      JCR_TEST_S3_BUCKET: jcr
      JCR_TEST_S3_ACCESS_KEY_ID: minio
      JCR_TEST_S3_SECRET_ACCESS_KEY: minio-password
      JCR_TEST_S3_FORCE_PATH_STYLE: "true"
      JCR_TEST_S3_CREATE_BUCKET: "1"
      JCR_TEST_DOCKER_CLIENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run --detach --rm \
            --name jcr-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minio \
            --env MINIO_ROOT_PASSWORD=minio-password \
            minio/minio:latest server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Build OCI Distribution conformance runner
        run: |
          git clone --depth 1 --branch v1.1.1 \
            https://github.com/opencontainers/distribution-spec.git \
            "${RUNNER_TEMP}/distribution-spec"
          cd "${RUNNER_TEMP}/distribution-spec/conformance"
          go test -c -o "${RUNNER_TEMP}/oci-conformance.test"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
        env:
          JCR_TEST_CONFORMANCE_BINARY: ${{ runner.temp }}/oci-conformance.test
