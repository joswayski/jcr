name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jcr
          POSTGRES_USER: jcr
          POSTGRES_PASSWORD: jcr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jcr -d jcr"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://jcr:jcr@127.0.0.1:5432/jcr
      JCR_DATABASE_URL: postgres://jcr:jcr@127.0.0.1:5432/jcr
      JCR_JWT_SECRET: ci-only-secret-with-at-least-32-bytes
      JCR_BOOTSTRAP_EMAIL: jose@example.com
      JCR_TEST_BUCKET_ENDPOINT: http://127.0.0.1:9000
      JCR_TEST_BUCKET_REGION: garage
      JCR_TEST_BUCKET_NAME: jcr
      JCR_TEST_BUCKET_ACCESS_KEY_ID: GK0123456789abcdef0123456789abcdef
      JCR_TEST_BUCKET_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JCR_TEST_BUCKET_FORCE_PATH_STYLE: "true"
      JCR_TEST_DOCKER_CLIENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: Swatinem/rust-cache@v2
      - name: Start Garage
        run: |
          docker run --detach --rm \
            --name jcr-ci-garage \
            --publish 9000:3900 \
            --volume "${PWD}/dev/garage.toml:/etc/garage.toml:ro" \
            --env GARAGE_CONFIG_FILE=/etc/garage.toml \
            --env GARAGE_DEFAULT_ACCESS_KEY=GK0123456789abcdef0123456789abcdef \
            --env GARAGE_DEFAULT_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --env GARAGE_DEFAULT_BUCKET=jcr \
            dxflrs/garage:v2.3.0 \
            /garage server --single-node --default-bucket
          for attempt in {1..30}; do
            if docker exec jcr-ci-garage /garage status; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Build OCI Distribution conformance runner
        run: |
          git clone --depth 1 --branch v1.1.1 \
            https://github.com/opencontainers/distribution-spec.git \
            "${RUNNER_TEMP}/distribution-spec"
          cd "${RUNNER_TEMP}/distribution-spec/conformance"
          go test -c -o "${RUNNER_TEMP}/oci-conformance.test"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
        env:
          JCR_TEST_CONFORMANCE_BINARY: ${{ runner.temp }}/oci-conformance.test
