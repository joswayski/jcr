name: jcr

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jcr
      POSTGRES_USER: jcr
      POSTGRES_PASSWORD: jcr
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jcr -d jcr"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - jcr-postgres:/var/lib/postgresql/data

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: jcr
    ports:
      - "9000:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./dev/garage.toml:/etc/garage.toml:ro
      - jcr-garage-meta:/var/lib/garage/meta
      - jcr-garage-data:/var/lib/garage/data

volumes:
  jcr-postgres:
  jcr-garage-meta:
  jcr-garage-data:
