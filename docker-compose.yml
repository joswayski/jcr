name: jcr

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jcr
      POSTGRES_USER: jcr
      POSTGRES_PASSWORD: jcr
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jcr -d jcr"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - jcr-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - jcr-minio:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minio minio-password
        mc mb --ignore-existing local/jcr

volumes:
  jcr-postgres:
  jcr-minio:
